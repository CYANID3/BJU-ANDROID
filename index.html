<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#10141c">
<script>try{var s=JSON.parse(localStorage.getItem("bju2")).set||{};if(s.th==="light"||s.th==="dark")document.documentElement.dataset.theme=s.th;if(/^#[0-9a-f]{6}$/i.test(s.ac||""))document.querySelector('meta[name="theme-color"]').content=s.ac}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="БЖУ"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" type="image/png" sizes="48x48" href="/favicon.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="build" content="%VITE_BUILD%">
<title>БЖУ — дневник питания</title>
<!-- @parts css src/css --><script>window.BJU_NATIVE_READY=new Promise(r=>window.BJU_NATIVE_READY_RESOLVE=r)</script><script type="module" src="./capacitor-bridge.js"></script></head><body>
<!-- Шапка: день, стрелки. Касание даты — календарь -->
<header class="nav"><button class="ib" onclick="go(-1)" aria-label="Предыдущий день"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><b id="dt" role="button" tabindex="0" onkeydown="if(event.key==='Enter')cal()" onclick="dtTap(event)">&nbsp;</b><button class="ib" onclick="go(1)" aria-label="Следующий день"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></header>
<main id="app"></main>
<!-- Нижняя панель: места и большая кнопка в центре настраиваются (Настройки › Нижняя панель), собирается в barSync() -->
<nav class="bt" aria-label="Разделы"></nav>
<!-- Нижний лист: шапка, прокручиваемое содержимое, низ (кнопки действия и своя клавиатура — всегда у нижнего края) -->
<div id="ov"><div class="sh" role="dialog" aria-modal="true" aria-labelledby="st">
 <div class="hd"><button id="hb" class="ib hb" onclick="backStep()" aria-label="Назад" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button id="hl" class="ib" aria-label="Предыдущий месяц" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ht"><b id="st"></b><small id="ss"></small></div><button id="hr" class="ib" aria-label="Следующий месяц" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><button class="x" onclick="xcl()" aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="shb">
 <!-- список продуктов: при добавлении, «Продукты», выбор ингредиента -->
 <div id="v1"><div id="mc" class="seg mg" role="radiogroup" aria-label="Приём пищи" hidden></div><div class="fs"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" placeholder="Найти продукт…" oninput="lst()" autocomplete="off" enterkeyhint="search"></div><div class="lr"><button class="ln" onclick="nw()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Новый продукт</button><button id="dbn" class="ln" onclick="dbt()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 7.5c0-1.4 1-1.6 1-3M12.5 7.5c0-1.4 1-1.6 1-3"/><path d="M9 20h6"/></svg><span>Новое блюдо</span></button></div><div id="pf" class="seg pf" hidden></div><div id="ls"></div></div>
 <!-- количество -->
 <div id="v2" hidden><div id="em" class="seg mg" role="radiogroup" aria-label="Приём пищи" hidden></div><div id="un" class="seg qu"></div><div class="vf"><input id="gr" class="num" type="text" inputmode="none" autocomplete="off" enterkeyhint="done" placeholder="0" oninput="pv()" onkeydown="if(event.key==='Enter')ad()" aria-label="Количество"><span id="gu">г</span></div><div id="ch" class="qc"></div><div id="pvw" class="qp"></div></div>
 <!-- новый продукт / изменение продукта -->
 <div id="v3" hidden><input id="nn" placeholder="Название" autocomplete="off" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();kpNext()}"><div class="sec">На 100 г</div><div class="g3"><div><input id="np" class="num" placeholder="0" oninput="nkc()" type="text" inputmode="none" autocomplete="off" aria-label="Белки на 100 г"><label for="np">Белки</label></div><div><input id="nf" class="num" placeholder="0" oninput="nkc()" type="text" inputmode="none" autocomplete="off" aria-label="Жиры на 100 г"><label for="nf">Жиры</label></div><div><input id="nc" class="num" placeholder="0" oninput="nkc()" type="text" inputmode="none" autocomplete="off" aria-label="Углеводы на 100 г"><label for="nc">Углеводы</label></div></div><div id="nk" class="hint"></div><div id="unr"></div><button class="ln g lft" onclick="unAdd()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Единица измерения<small>— например, «шт» = 60 г</small></button><button id="dl" class="ln dg" onclick="rm()">Удалить продукт</button></div>
 <!-- норма -->
 <div id="v4" hidden><div class="g3"><div><input id="gp" class="num" oninput="gk2()" type="text" inputmode="none" autocomplete="off" aria-label="Белки, г"><label for="gp">Белки, г</label></div><div><input id="gf" class="num" oninput="gk2()" type="text" inputmode="none" autocomplete="off" aria-label="Жиры, г"><label for="gf">Жиры, г</label></div><div><input id="gc" class="num" oninput="gk2()" type="text" inputmode="none" autocomplete="off" aria-label="Углеводы, г"><label for="gc">Углеводы, г</label></div></div></div>
 <!-- календарь -->
 <div id="v6" hidden><div id="cwk" class="cw"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><div id="cg" class="cg"></div><div id="cs" class="leg c"></div></div>
 <!-- блюдо -->
 <div id="v8" hidden><input id="dn" placeholder="Название блюда" autocomplete="off" enterkeyhint="done"><div id="dh" class="sec"></div><div id="di"></div><button class="ln" onclick="dring()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Добавить ингредиент</button><div class="sec">Вес готового блюда</div><div class="vf sm"><input id="dw" class="num" type="text" inputmode="none" autocomplete="off" oninput="dsum()" aria-label="Вес готового блюда, г"><span>г</span></div><div id="ds" class="sumbox"></div><button id="ddl" class="ln dg" onclick="rm()">Удалить блюдо</button></div>
 <!-- «Настройки»: все настройки одной страницей -->
 <div id="v7" hidden></div>
 <!-- статистика -->
 <div id="v9" hidden><div id="stc"></div></div>
 <!-- вес -->
 <div id="v10" hidden><div class="vf wv"><button class="pm" onmousedown="event.preventDefault()" onclick="wSt(-1)" aria-label="Меньше на 0,1 кг">−</button><input id="wv" class="num" type="text" inputmode="none" autocomplete="off" enterkeyhint="done" placeholder="0,0" oninput="wPv()" onkeydown="if(event.key==='Enter')wSave()" aria-label="Вес, кг"><span>кг</span><button class="pm r" onmousedown="event.preventDefault()" onclick="wSt(1)" aria-label="Больше на 0,1 кг">+</button></div><div id="wpv" class="hint c"></div></div>
 <!-- свой цвет -->
 <div id="v11" hidden><div class="cpk"><div id="cpa" class="cpa nodrag" role="slider" aria-label="Насыщенность и яркость"><i id="cpak"></i></div><div id="cph" class="cph nodrag" role="slider" aria-label="Оттенок"><i id="cphk"></i></div><div class="cpr"><span id="cpv" class="cpv"></span><input id="cpx" maxlength="7" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="#RRGGBB" oninput="cpHex(this.value)" aria-label="Код цвета"></div><div id="cps" class="cps"></div></div></div>
 <!-- похожие продукты при слиянии -->
 <div id="v12" hidden><div id="mgl"></div></div>
 <!-- экран выбора варианта настройки -->
 <div id="v13" hidden><div id="pko" class="grp"></div><div id="pkx"></div></div>
 <!-- вибрация -->
 <div id="v14" hidden></div>
 <!-- нижняя панель: образец, кнопка, состав, места; выбор действия для места; тема и фон -->
 <div id="v15" hidden></div>
 <div id="v16" hidden></div>
 <div id="v17" hidden></div>
 <!-- файл данных -->
 <div id="v5" hidden><div id="fi" class="fst"></div><div class="gh">Основной файл</div><div class="grp"><button class="row" onclick="fc2()"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg></span><span class="tx">Создать новый файл<small>Сохранить данные в файл и сделать его основным</small></span></button><button class="row" onclick="fo2()"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8L12 4l7.5 4v8L12 20l-7.5-4z"/><path d="M12 12v8M4.5 8L12 12l7.5-4"/></svg></span><span class="tx">Открыть существующий файл<small>Например, после переустановки или с другого телефона. Текущие данные заменятся, перед этим — резервная копия</small></span></button></div><div class="gh">Импорт</div><div class="grp"><button id="mgb" class="row" onclick="mgPick()"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v6a5 5 0 0 0 5 5h5"/><path d="M14 12l3 3-3 3"/><path d="M7 20v-4"/></svg></span><span class="tx">Добавить продукты из файла<small>Из чужого файла или старой копии. Дневник не меняется, вы увидите, что добавится</small></span></button></div><input id="fmg" type="file" accept=".json,.txt,application/json,text/plain" hidden onchange="mgFile(this)"><input id="fin" type="file" accept=".json,.txt,application/json,text/plain" hidden onchange="im(this)"></div>
 </div>
 <!-- низ листа: кнопки действия текущего экрана (data-v) и своя клавиатура -->
 <div class="shf">
  <div class="ft" data-v="2"><button id="ab" class="pb" onmousedown="event.preventDefault()" onclick="ad()">Добавить</button></div>
  <div class="ft" data-v="3"><button id="mkb" class="pb" onmousedown="event.preventDefault()" onclick="kpNext()">Сохранить</button></div>
  <div class="ft" data-v="4"><button id="sgb" class="pb" onmousedown="event.preventDefault()" onclick="kpNext()">Сохранить</button></div>
  <div class="ft" data-v="5"><button id="foff" class="pb dg" onclick="nfOff()" hidden>Отключить файл</button></div>
  <div class="ft" data-v="6"><button class="pb t" onclick="pd(today)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Сегодня</button></div>
  <div class="ft" data-v="8"><button id="dsb" class="pb" onmousedown="event.preventDefault()" onclick="dsv()">Сохранить блюдо</button></div>
  <div class="ft two" data-v="10"><button id="wdl" class="pb g" onclick="wDel()" hidden>Удалить</button><button id="wsb" class="pb" onmousedown="event.preventDefault()" onclick="wSave()">Сохранить</button></div>
  <div class="ft" data-v="11"><button id="cpok" class="pb" onclick="cpOk()">Готово</button></div>
  <div class="ft" data-v="12"><button id="mgok" class="pb" onclick="mgDone()">Готово</button></div>
  <div id="kp" class="kpd" role="group" aria-label="Цифровая клавиатура"></div>
 </div>
</div></div>
<div id="dg"><div class="dc" role="alertdialog" aria-modal="true" aria-labelledby="dgm"><div id="dgt"></div><div id="dgm"></div><div class="dbs"><button id="dgn">Отмена</button><button id="dgy">ОК</button></div></div></div>
<div id="pu" class="pu" aria-hidden="true"><div class="pw"><div class="pc"><svg class="r" viewBox="0 0 50 50"><circle cx="25" cy="25" r="23"/></svg><span id="pa" class="pa"></span></div><div id="pt" class="pl"></div></div></div>
<div id="tt" class="tt" role="status" aria-live="polite"><span id="tm"></span><button onclick="undo()">Отменить</button></div>
<!-- @parts js src/js --></body></html>
