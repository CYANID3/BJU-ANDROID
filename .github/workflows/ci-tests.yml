name: CI tests report (temporary)
on:
  push:
    branches: ['ci-check-*']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests x2, output to branch
        run: |
          set +e
          npm run build
          for i in 1 2; do RATE=4 node --test tests/_fz.test.mjs > test-out-$i.txt 2>&1; echo "EXIT $?" >> test-out-$i.txt; done
          grep -h -B2 -A40 "^not ok" test-out-*.txt > test-fail.txt || true
          git config user.name ci; git config user.email ci@example.com
          git add test-out-*.txt test-fail.txt && git commit -m "test report" && git push
